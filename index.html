<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Pro | سیستم مدیریت ارتباط با مشتری</title>
    <meta name="description" content="سیستم حرفه‌ای مدیریت ارتباط با مشتری - CRM Pro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { font-family: 'Inter', 'Vazirmatn', sans-serif; direction: rtl; }
      #root { min-height: 100vh; }
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FCFCFD;
        z-index: 9999;
      }
      .app-loader-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #EAECF0;
        border-top-color: #1570EF;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="app-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
